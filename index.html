<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chupacabras Run Tracker</title>
    <!-- Librería jsPDF para generar el PDF en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        select, input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: var(--text-main);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .hidden {
            display: none !important;
        }

        /* Tracker View */
        .tracker-board {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-box strong {
            font-size: 1.3rem;
            color: var(--text-main);
        }

        /* Visual Track */
        .race-track {
            position: relative;
            height: 60px;
            background: linear-gradient(90deg, #1e293b, #334155);
            border-radius: 8px;
            margin-top: 15px;
            overflow: hidden;
            border: 1px solid #475569;
        }

        .runner-icon, .chupacabra-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            transition: left 0.5s linear;
        }

        .alert-box {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            font-size: 1rem;
        }

        .safe { background-color: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
        .danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐐 Chupacabras Run</h1>
        <p class="subtitle">Corre antes de que te alcance</p>

        <!-- SETUP SCREEN -->
        <div id="setup-screen">
            <div class="form-group">
                <label for="activity-type">¿Qué ejercicio vas hacer?</label>
                <select id="activity-type">
                    <option value="Correr">Correr</option>
                    <option value="Trotar">Trotar</option>
                    <option value="Caminar">Caminar</option>
                </select>
            </div>

            <div class="form-group">
                <label for="target-miles">¿Cuántas millas?</label>
                <input type="number" id="target-miles" value="3.1" step="0.1" min="0.1">
            </div>

            <div class="form-group">
                <label for="target-time">¿En cuánto tiempo (minutos)?</label>
                <input type="number" id="target-time" value="30" min="1">
            </div>

            <div class="form-group">
                <label for="chupacabra-mode">Nivel del Chupacabras (Velocidad)</label>
                <select id="chupacabra-mode">
                    <option value="1.2">Suave (1.2 mph)</option>
                    <option value="2.5" selected>Mediano (2.5 mph)</option>
                    <option value="5.0">Heavy / Rápido (5.0 mph)</option>
                </select>
            </div>

            <button onclick="startRun()">¡Arrancar Corrida!</button>
        </div>

        <!-- TRACKER SCREEN -->
        <div id="tracker-screen" class="hidden">
            <div class="tracker-board">
                <div class="stats-grid">
                    <div class="stat-box">
                        <span>Distancia Recorrida</span>
                        <strong id="user-dist">0.00 mi</strong>
                    </div>
                    <div class="stat-box">
                        <span>Distancia Chupacabras</span>
                        <strong id="chupa-dist">0.00 mi</strong>
                    </div>
                    <div class="stat-box">
                        <span>Tiempo Transcurrido</span>
                        <strong id="timer-display">00:00</strong>
                    </div>
                    <div class="stat-box">
                        <span>Ritmo Actual (Pace)</span>
                        <strong id="pace-display">-- min/mi</strong>
                    </div>
                </div>

                <div class="race-track">
                    <div id="runner-pos" class="runner-icon" style="left: 0%;">🏃‍♂️</div>
                    <div id="chupa-pos" class="chupacabra-icon" style="left: 0%;">🐐</div>
                </div>
            </div>

            <div id="status-alert" class="alert-box safe">¡Vas despegado! Sigue así.</div>

            <button onclick="stopAndGeneratePDF()" style="background-color: var(--danger); margin-top: 10px;">🛑 Terminar / Generar PDF</button>
        </div>
    </div>

    <script>
        let timerInterval;
        let secondsElapsed = 0;
        let targetMiles = 3.1;
        let targetTimeMin = 30;
        let chupaSpeed = 2.5; // mph
        let userDistance = 0;
        let chupaDistance = 0;
        let totalSteps = 0;
        let activityType = "Correr";
        let chupaModeText = "Mediano (2.5 mph)";

        function startRun() {
            targetMiles = parseFloat(document.getElementById('target-miles').value) || 3.1;
            targetTimeMin = parseInt(document.getElementById('target-time').value) || 30;
            chupaSpeed = parseFloat(document.getElementById('chupacabra-mode').value) || 2.5;
            
            const modeSelect = document.getElementById('chupacabra-mode');
            chupaModeText = modeSelect.options[modeSelect.selectedIndex].text;
            activityType = document.getElementById('activity-type').value;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('tracker-screen').classList.remove('hidden');

            secondsElapsed = 0;
            userDistance = 0;
            chupaDistance = 0;
            totalSteps = 0;

            timerInterval = setInterval(updateSimulation, 1000);
        }

        function updateSimulation() {
            secondsElapsed++;
            const hoursElapsed = secondsElapsed / 3600;

            // Velocidad del usuario según la meta planteada
            const userSpeedMps = targetMiles / (targetTimeMin * 60); // millas por segundo
            userDistance = userSpeedMps * secondsElapsed;

            // El Chupacabras avanza a su velocidad fija elegida
            const chupaSpeedMps = chupaSpeed / 3600;
            chupaDistance = chupaSpeedMps * secondsElapsed;

            // Cálculo estimado de pasos (aprox 2,000 pasos por milla corriendo/caminando)
            totalSteps = Math.round(userDistance * 2000);

            // Ritmo (Pace) en min/mi
            let paceMinPerMile = 0;
            if (userDistance > 0) {
                const totalMinutes = secondsElapsed / 60;
                paceMinPerMile = totalMinutes / userDistance;
            }
            const paceMinutes = Math.floor(paceMinPerMile);
            const paceSeconds = Math.round((paceMinPerMile - paceMinutes) * 60);
            const paceStr = userDistance > 0 ? `${paceMinutes}:${paceSeconds.toString().padStart(2, '0')} min/mi` : `-- min/mi`;
            document.getElementById('pace-display').textContent = paceStr;

            // Formato de tiempo transcurrido
            const mins = Math.floor(secondsElapsed / 60);
            const secs = secondsElapsed % 60;
            document.getElementById('timer-display').textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            // Actualizar textos en pantalla
            document.getElementById('user-dist').textContent = userDistance.toFixed(2) + ' mi';
            document.getElementById('chupa-dist').textContent = chupaDistance.toFixed(2) + ' mi';

            // Porcentajes pista visual
            const userPercent = Math.min((userDistance / targetMiles) * 90, 90);
            const chupaPercent = Math.min((chupaDistance / targetMiles) * 90, 90);

            document.getElementById('runner-pos').style.left = userPercent + '%';
            document.getElementById('chupa-pos').style.left = chupaPercent + '%';

            // Alertas de cercanía
            const alertBox = document.getElementById('status-alert');
            if (chupaDistance >= userDistance) {
                alertBox.className = "alert-box danger";
                alertBox.textContent = "⚠️ ¡TE ALCANZÓ EL CHUPACABRAS! ¡CORRE MÁS RÁPIDO! ⚠️";
            } else if ((userDistance - chupaDistance) < 0.1) {
                alertBox.className = "alert-box danger";
                alertBox.textContent = "🚨 ¡El Chupacabras te está pisando los talones!";
            } else {
                alertBox.className = "alert-box safe";
                alertBox.textContent = "👍 ¡Le llevas ventaja al Chupacabras! ¡No bajes el ritmo!";
            }

            // Fin de la meta por distancia
            if (userDistance >= targetMiles) {
                clearInterval(timerInterval);
                alertBox.className = "alert-box safe";
                alertBox.textContent = "🎉 ¡Completaste la ruta y escapaste del Chupacabras!";
            }
        }

        function stopAndGeneratePDF() {
            clearInterval(timerInterval);

            // Generar PDF usando jsPDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Encabezado
            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.setTextColor(249, 115, 22);
            doc.text("🐐 Reporte de Corrida - Chupacabras Run", 20, 20);

            doc.setFontSize(11);
            doc.setTextColor(100, 100, 100);
            doc.text(`Fecha: ${new Date().toLocaleDateString()} a las ${new Date().toLocaleTimeString()}`, 20, 28);

            doc.setLineWidth(0.4);
            doc.line(20, 33, 190, 33);

            // Métricas
            doc.setFont("helvetica", "normal");
            doc.setFontSize(13);
            doc.setTextColor(30, 41, 59);

            let y = 45;
            doc.text(`• Actividad realizada: ${activityType}`, 20, y); y += 10;
            doc.text(`• Distancia recorrida: ${userDistance.toFixed(2)} millas`, 20, y); y += 10;
            doc.text(`• Tiempo total: ${document.getElementById('timer-display').textContent}`, 20, y); y += 10;
            doc.text(`• Ritmo promedio (Pace): ${document.getElementById('pace-display').textContent}`, 20, y); y += 10;
            doc.text(`• Pasos estimados: ${totalSteps.toLocaleString()} pasos`, 20, y); y += 10;
            doc.text(`• Nivel del Chupacabras: ${chupaModeText}`, 20, y); y += 10;

            // Estado final
            doc.setFont("helvetica", "bold");
            y += 5;
            if (chupaDistance >= userDistance) {
                doc.setTextColor(239, 68, 68);
                doc.text(`Resultado: ¡El Chupacabras te alcanzó! 💀`, 20, y);
            } else {
                doc.text(`Resultado: ¡Escapaste con vida del Chupacabras! 🎉`, 20, y);
            }

            // Descargar archivo
            doc.save(`Chupacabras_Run_${new Date().toISOString().slice(0,10)}.pdf`);

            // Regresar a la pantalla de inicio
            document.getElementById('tracker-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
