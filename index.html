<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RunQuest: Boricua Edition 🇵🇷</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0a0a12;
      color: #ffffff;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Overlay de Borrachera / Vibe */
    #drunk-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 500;
      transition: all 0.5s ease;
    }
    .drunk-active {
      animation: sway 2.5s infinite alternate ease-in-out;
      backdrop-filter: blur(2px) hue-rotate(60deg) contrast(120%);
    }
    @keyframes sway {
      0% { transform: rotate(-2.5deg) scale(1.03); }
      100% { transform: rotate(2.5deg) scale(1.03); }
    }

    /* Dashboard Superior Cyberpunk */
    #top-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: rgba(10, 10, 20, 0.92);
      border-bottom: 2px solid #00E676;
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
      padding: 12px 4px;
      z-index: 1000;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .metric-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .metric-value {
      font-size: 1.25rem;
      font-weight: 900;
      color: #00E676;
      text-shadow: 0 0 8px rgba(0, 230, 118, 0.6);
    }
    .metric-label {
      font-size: 0.6rem;
      color: #8888aa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    
    /* Estilo del Mapa Tecnológico */
    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
      background: #090d16;
    }

    /* Íconos Grandes e Interactivos en el Mapa */
    .map-avatar {
      font-size: 42px;
      line-height: 42px;
      text-align: center;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
      transition: transform 0.2s ease;
    }
    .monster-diabolic {
      font-size: 48px;
      line-height: 48px;
      text-align: center;
      filter: drop-shadow(0 0 12px #ff0000) drop-shadow(0 0 25px #ff0000);
      animation: pulseMonster 1s infinite alternate ease-in-out;
    }
    @keyframes pulseMonster {
      0% { transform: scale(1); filter: drop-shadow(0 0 10px #ff0000); }
      100% { transform: scale(1.25); filter: drop-shadow(0 0 25px #ff0000) drop-shadow(0 0 35px #ff5500); }
    }
    .item-icon {
      font-size: 36px;
      line-height: 36px;
      text-align: center;
      filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.8));
      animation: floatItem 2s infinite alternate ease-in-out;
    }
    @keyframes floatItem {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    
    /* Barra de Controles Inferior */
    #bottom-bar {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 12px;
      width: 92%;
      max-width: 420px;
    }
    .btn-action {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 900;
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 230, 118, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      letter-spacing: 1px;
    }
    #btn-start {
      background: linear-gradient(135deg, #00E676, #00B0FF);
    }
    #btn-stop {
      background: linear-gradient(135deg, #FF1744, #D50000);
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 23, 68, 0.6);
      display: none;
    }
    .btn-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(20, 20, 35, 0.9);
      border: 2px solid #00B0FF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 176, 255, 0.4);
    }
    
    /* Config Modal Cyberpunk */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 12, 0.92);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .modal-content {
      background: #121224;
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 380px;
      border: 2px solid #00E676;
      box-shadow: 0 0 30px rgba(0, 230, 118, 0.3);
    }
    .modal-header {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 18px;
      color: #00E676;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 1px;
    }
    .setting-group {
      margin-bottom: 14px;
    }
    .setting-group label {
      display: block;
      font-size: 0.8rem;
      color: #aaaaff;
      margin-bottom: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .setting-group select, .setting-group input {
      width: 100%;
      padding: 12px;
      background: #1a1a36;
      border: 1px solid #333366;
      color: #fff;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
    }
    .btn-close {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00E676, #00B0FF);
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="drunk-overlay"></div>
    
    <!-- Top Bar Metrics -->
    <div id="top-bar">
      <div class="metric-card">
        <span class="metric-value" id="val-dist">0.00</span>
        <span class="metric-label">Millas</span>
      </div>
      <div class="metric-card">
        <span class="metric-value" id="val-steps">0</span>
        <span class="metric-label">Pasos</span>
      </div>
      <div class="metric-card">
        <span class="metric-value" id="val-pace">0:00</span>
        <span class="metric-label">min / mi</span>
      </div>
      <div class="metric-card">
        <span class="metric-value" id="val-vibe">0%</span>
        <span class="metric-label" id="lbl-vibe">Vibe 🇵🇷</span>
      </div>
    </div>

    <!-- Mapa Tecnológico -->
    <div id="map"></div>

    <!-- Barra Inferior de Controles -->
    <div id="bottom-bar">
      <button class="btn-icon" id="btn-config" title="Configurar Carrera">⚙️</button>
      <button class="btn-action" id="btn-start">¡ARRANCAR ROUTE!</button>
      <button class="btn-action" id="btn-stop">PAUSAR / TERMINAR</button>
    </div>
  </div>

  <!-- Modal de Configuración -->
  <div class="modal" id="config-modal">
    <div class="modal-content">
      <div class="modal-header">⚙️ Configurar Quest 🇵🇷</div>
      
      <div class="setting-group">
        <label>Modo de Juego:</label>
        <select id="sel-mode">
          <option value="chupa">👹 Chupacabras Run (Zombi Diabólico)</option>
          <option value="coqui">🐸 Cacería de Coquíes</option>
          <option value="ron">🍹 Ron Boricua Power-ups</option>
          <option value="borracho">🍺 Ruta del Borracho (Chinchorreo)</option>
        </select>
      </div>

      <div class="setting-group" id="group-speed">
        <label>Velocidad del Chupacabras:</label>
        <select id="sel-speed">
          <option value="1.2">🐢 Lento (1.2 mph - Caminata)</option>
          <option value="2.5">🚶‍♂️ Mediano (2.5 mph - Paso Fuerte)</option>
          <option value="5.0">🏃‍♂️ Rápido (5.0 mph - Carrera / Trote)</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Meta de Distancia:</label>
        <select id="sel-target-dist">
          <option value="1.0">1.0 Milla (~1.6 km)</option>
          <option value="3.1">3.1 Millas (5K Run)</option>
          <option value="5.0">5.0 Millas (~8 km)</option>
          <option value="0.5">0.5 Millas (Caminata Corta)</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Tiempo Meta Estimado:</label>
        <select id="sel-target-time">
          <option value="15">15 Minutos</option>
          <option value="30">30 Minutos</option>
          <option value="45">45 Minutos</option>
          <option value="60">60 Minutos (1 Hora)</option>
        </select>
      </div>

      <button class="btn-close" id="btn-close-modal">¡GUARDAR Y EMPEZAR!</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, userMarker, monsterMarker;
    let watchId = null;
    let isTracking = false;
    let userPath = [];
    let polyline = null;
    
    let totalDistanceMiles = 0;
    let stepCount = 0;
    let startTime = null;
    let timerInterval = null;
    let vibeLevel = 0;
    
    let userPos = null;
    let monsterPos = null;
    
    // Configuraciones de Carrera
    let gameMode = 'chupa';
    let chupacabrasSpeedMph = 1.2;
    let targetDistanceMiles = 1.0;
    let targetTimeMinutes = 30;
    let activeItems = [];

    function initMap() {
      const defaultLat = 18.4655;
      const defaultLng = -66.1057;

      // Inicializar mapa con tema tecnológico oscuro (CartoDB Dark Matter)
      map = L.map('map', { zoomControl: false }).setView([defaultLat, defaultLng], 16);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      // Íconos Gigantes Interactivos
      const runnerIcon = L.divIcon({ html: '<div class="map-avatar">🏃‍♂️</div>', className: '', iconSize: [42, 42] });
      const monsterIcon = L.divIcon({ html: '<div class="monster-diabolic">👹</div>', className: '', iconSize: [48, 48] });

      userMarker = L.marker([defaultLat, defaultLng], { icon: runnerIcon }).addTo(map);
      monsterMarker = L.marker([defaultLat, defaultLng], { icon: monsterIcon }).addTo(map);
      monsterMarker.setOpacity(0); // Oculto si no es modo Chupacabras

      // Línea de Ruta Neón Neón
      polyline = L.polyline([], { 
        color: '#00E676', 
        weight: 6, 
        opacity: 0.9, 
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(p => {
          const lat = p.coords.latitude;
          const lng = p.coords.longitude;
          userPos = { lat, lng };
          map.setView([lat, lng], 17);
          userMarker.setLatLng([lat, lng]);
          spawnCheckpoints();
        });
      }
    }

    // Distribución de Checkpoints/Items basados en la Meta de Distancia
    function spawnCheckpoints() {
      if (!userPos) return;
      activeItems.forEach(i => map.removeLayer(i.marker));
      activeItems = [];

      let emojis = ['🍺', '🍹', '🍻', '🍷', '🏬'];
      if (gameMode === 'coqui') emojis = ['🐸', '🟢', '✨'];
      else if (gameMode === 'ron') emojis = ['🍹', '🥃', '⚡'];
      else if (gameMode === 'chupa') emojis = ['💀', '🔥', '⚡'];

      // Cantidad de checkpoints según la distancia seleccionada
      const numPoints = Math.round(targetDistanceMiles * 5) + 3;
      const radiusFactor = targetDistanceMiles * 0.008;

      for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2 + (Math.random() * 0.5);
        const distOffset = (Math.random() * 0.5 + 0.5) * radiusFactor;
        
        const offLat = Math.sin(angle) * distOffset;
        const offLng = Math.cos(angle) * distOffset;
        
        const emoji = emojis[Math.floor(Math.random() * emojis.length)];
        const icon = L.divIcon({ html: `<div class="item-icon">${emoji}</div>`, className: '', iconSize: [36, 36] });
        
        const m = L.marker([userPos.lat + offLat, userPos.lng + offLng], { icon }).addTo(map);
        activeItems.push({ lat: userPos.lat + offLat, lng: userPos.lng + offLng, marker: m });
      }
    }

    function getDistanceInMiles(lat1, lon1, lat2, lon2) {
      const R = 3958.8;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function startRun() {
      isTracking = true;
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'flex';

      totalDistanceMiles = 0;
      stepCount = 0;
      vibeLevel = 0;
      userPath = [];
      startTime = Date.now();

      timerInterval = setInterval(updateTimerAndPace, 1000);

      if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', handleMotion);
      }

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(updatePosition, null, {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 5000
        });
      }
    }

    let lastAccel = 0;
    function handleMotion(e) {
      if (!isTracking) return;
      const acc = e.accelerationIncludingGravity;
      if (!acc) return;
      const totalAcc = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
      if (Math.abs(totalAcc - lastAccel) > 2.6) {
        stepCount++;
        document.getElementById('val-steps').innerText = stepCount;
      }
      lastAccel = totalAcc;
    }

    function updatePosition(p) {
      if (!isTracking) return;
      const lat = p.coords.latitude;
      const lng = p.coords.longitude;

      if (userPos) {
        const d = getDistanceInMiles(userPos.lat, userPos.lng, lat, lng);
        if (d > 0.0003 && d < 0.1) {
          totalDistanceMiles += d;
        }
      }

      userPos = { lat, lng };
      userPath.push([lat, lng]);

      userMarker.setLatLng([lat, lng]);
      polyline.setLatLngs(userPath);
      map.panTo([lat, lng]);

      document.getElementById('val-dist').innerText = totalDistanceMiles.toFixed(2);

      checkItemCollection();
      if (gameMode === 'chupa') {
        updateMonsterPosition();
      }
    }

    function checkItemCollection() {
      activeItems.forEach((item, index) => {
        const d = getDistanceInMiles(userPos.lat, userPos.lng, item.lat, item.lng);
        if (d < 0.015) { // Checkpoint alcanzado
          map.removeLayer(item.marker);
          activeItems.splice(index, 1);
          vibeLevel += 20;
          if (vibeLevel > 100) vibeLevel = 100;
          document.getElementById('val-vibe').innerText = vibeLevel + '%';

          if (gameMode === 'borracho' && vibeLevel >= 30) {
            document.getElementById('drunk-overlay').classList.add('drunk-active');
          }
        }
      });
    }

    function updateMonsterPosition() {
      if (!monsterPos) {
        monsterPos = { lat: userPos.lat - 0.0005, lng: userPos.lng - 0.0005 };
      }
      const dLat = userPos.lat - monsterPos.lat;
      const dLng = userPos.lng - monsterPos.lng;
      
      // Ajuste de velocidad según la opción seleccionada
      const speedFactor = chupacabrasSpeedMph * 0.000005;
      monsterPos.lat += dLat * speedFactor;
      monsterPos.lng += dLng * speedFactor;
      monsterMarker.setLatLng([monsterPos.lat, monsterPos.lng]);
    }

    function updateTimerAndPace() {
      const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
      
      // Ritmo en tiempo real (minutos por milla)
      if (totalDistanceMiles > 0.02) {
        const totalMins = (elapsedSec / 60) / totalDistanceMiles;
        const mins = Math.floor(totalMins);
        const secs = Math.floor((totalMins - mins) * 60);
        document.getElementById('val-pace').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
      } else {
        document.getElementById('val-pace').innerText = `0:00`;
      }
    }

    function stopRun() {
      isTracking = false;
      document.getElementById('btn-start').style.display = 'flex';
      document.getElementById('btn-stop').style.display = 'none';

      if (watchId) navigator.geolocation.clearWatch(watchId);
      if (timerInterval) clearInterval(timerInterval);
      window.removeEventListener('devicemotion', handleMotion);
      document.getElementById('drunk-overlay').classList.remove('drunk-active');
    }

    // Control del Modal
    document.getElementById('btn-config').onclick = () => {
      document.getElementById('config-modal').style.display = 'flex';
    };

    document.getElementById('sel-mode').onchange = (e) => {
      const val = e.target.value;
      document.getElementById('group-speed').style.display = (val === 'chupa') ? 'block' : 'none';
    };

    document.getElementById('btn-close-modal').onclick = () => {
      gameMode = document.getElementById('sel-mode').value;
      chupacabrasSpeedMph = parseFloat(document.getElementById('sel-speed').value);
      targetDistanceMiles = parseFloat(document.getElementById('sel-target-dist').value);
      targetTimeMinutes = parseInt(document.getElementById('sel-target-time').value);

      monsterMarker.setOpacity(gameMode === 'chupa' ? 1 : 0);
      document.getElementById('lbl-vibe').innerText = gameMode === 'borracho' ? 'Borracho' : 'Vibe 🇵🇷';
      
      spawnCheckpoints();
      document.getElementById('config-modal').style.display = 'none';
    };

    document.getElementById('btn-start').onclick = startRun;
    document.getElementById('btn-stop').onclick = stopRun;

    window.onload = initMap;
  </script>
</body>
</html>
